apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: myapp-staging

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - path: replica-count.yaml
  - path: resource-limits.yaml

configMapGenerator:
  - name: myapp-config
    behavior: merge
    literals:
      - environment=staging
      - log_level=info
