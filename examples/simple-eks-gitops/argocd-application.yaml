apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  # The project the application belongs to
  project: default
  
  # Source of the application manifests
  source:
    repoURL: https://github.com/somkheartk/aws-gitops.git
    targetRevision: HEAD
    path: examples/simple-eks-gitops/app-manifests
  
  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  
  # Sync policy
  syncPolicy:
    automated:
      # Automatically sync when changes are detected
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
